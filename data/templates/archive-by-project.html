<header class="p-2">
  <h1 class="title is-1">$title$</h1>
</header>

<section class="p-2">
  $for(projects)$
    <h2 class="title is-2 mt-5 mb-3">
      $for(project)$
        <a href="$url$">$title$</a>
      $endfor$
    </h2>

    <div id="post-list" class="mx-auto">
      <div class="is-flex is-flex-wrap-wrap">
        $for(posts)$
          <div class="post">
            $partial("templates/includes/post-preview-small.html")$
          </div>
        $endfor$
      </div>
    </div>

  $endfor$
</section>
